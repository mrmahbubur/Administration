<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>MRS ADMIN — Digital Entrepreneurship & Web Resource Hub</title>
    <meta name="description" content="Official portal for MRS ADMIN (M R S Multiverse): online business insights, legitimate student earning guides, web management, upcoming projects, charity initiatives, and direct IT/CV services." />
    <meta property="og:title" content="MRS ADMIN — Digital Entrepreneurship & Web Resource Hub" />
    <meta property="og:description" content="Official portal for MRS ADMIN (M R S Multiverse): practical business strategies, web management, student resources, and direct remote services." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-50 text-neutral-900 antialiased selection:bg-amber-100 selection:text-amber-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="window.__showDeployNotice && window.__showDeployNotice()"></script>
    <script>
      (function () {
        function showDeployNotice() {
          var root = document.getElementById('root');
          if (!root || root.children.length > 0) return;
          root.innerHTML =
            '<div style="font-family:system-ui,-apple-system,sans-serif;max-width:560px;margin:48px auto;padding:24px;border:1px solid #e5e5e5;border-radius:12px;background:#ffffff;color:#171717;line-height:1.6;">' +
            '<h2 style="margin:0 0 8px;font-size:18px;font-weight:700;">GitHub Pages Build Source Needs GitHub Actions</h2>' +
            '<p style="margin:0 0 12px;font-size:14px;color:#525252;">GitHub Pages is currently serving the unbuilt source branch instead of the compiled Vite app.</p>' +
            '<ol style="margin:0;padding-left:20px;font-size:14px;color:#262626;">' +
            '<li>Open your repository on GitHub and go to <strong>Settings &rarr; Pages</strong>.</li>' +
            '<li>Under <strong>Build and deployment &rarr; Source</strong>, select <strong>GitHub Actions</strong>.</li>' +
            '<li>Open the <strong>Actions</strong> tab and re-run <strong>Deploy to GitHub Pages</strong>.</li>' +
            '</ol></div>';
        }
        window.__showDeployNotice = showDeployNotice;
        if (
          location.hostname.endsWith('.github.io') &&
          document.querySelector('script[src="/src/main.tsx"]')
        ) {
          showDeployNotice();
        }
      })();
    </script>
  </body>
</html>
